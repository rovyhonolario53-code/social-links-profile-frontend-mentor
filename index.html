<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <script src = "https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @font-face {
      font-family: "Figtree";
      src: url("./assets/fonts/Figtree-VariableFont_wght.ttf") format("truetype"); 
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    @theme {
      --font-inter: "Inter", sans-serif;
      --color-green: hsl(75, 94%, 57%);
      --color-gray-700: hsl(0, 0%, 20%);
      --color-gray-800: hsl(0, 0%, 8%);
      --color-gray-900: hsl(0, 0%, 12%);
    }
  </style>
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class = "flex justify-center items-center min-h-screen font-inter font-medium flex-col text-white">
  <main class = "flex flex-1 justify-center items-center">
    <div class = "bg-gray-800 rounded-[12px] w-full max-w-[384px] p-6 md:p-10">
      <div class = "flex flex-col justify-center items-center">
        <img src="assets/images/avatar-jessica.jpeg" alt="" class = "size-[88px] rounded-full mb-6">
        <h1 class = "font-semibold text-[24px] ">Jessica Randall</h1>
        <h2 class = "text-[14px] text-green font-semibold">London, United Kingdom</h2>
        <p class = "text-sm mt-6">"Front-end developer and avid reader."</p>
      </div>
      <div>
        <a href="#">Github</a>
        <a href="#">Frontend Mentor</a>
        <a href="#">LinkedIn</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
